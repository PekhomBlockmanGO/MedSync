<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import Google Font for a modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-blue-50 text-gray-800 antialiased min-h-screen">
    
    <div class="max-w-4xl mx-auto px-4 py-10">
        <!-- Header Section -->
        <header class="mb-10 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-4xl font-extrabold text-blue-900 tracking-tight">Caregiver Portal: Welcome, Mom</h1>
                <p class="text-blue-600 mt-2 text-lg font-medium">Monitor your family's medication adherence.</p>
            </div>
            <button onclick="fetchAlerts()" class="mt-4 sm:mt-0 flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh Alerts
            </button>
        </header>

        <!-- Active Alerts Card -->
        <section class="bg-white rounded-2xl shadow-md border border-blue-100 overflow-hidden">
            <div class="bg-red-600 px-8 py-5 border-b border-red-700">
                <div class="flex items-center space-x-3">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <h2 class="text-2xl font-bold text-white tracking-wide">Active Alerts</h2>
                </div>
            </div>
            
            <div class="p-8">
                <!-- Container for dynamically rendering alerts -->
                <div id="alerts-container" class="space-y-4">
                    <div class="flex justify-center items-center py-10">
                        <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p class="text-blue-500 font-semibold text-lg animate-pulse">Checking for missed doses...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Logic to Fetch and Render Alerts -->
    <script>
        function fetchAlerts() {
            const container = document.getElementById('alerts-container');
            
            // Show loading spinner while refreshing
            container.innerHTML = `
                <div class="flex justify-center items-center py-10">
                    <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-blue-500 font-semibold text-lg animate-pulse">Checking for missed doses...</p>
                </div>
            `;

            fetch("http://127.0.0.1:8000/alerts/check-missed")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    container.innerHTML = ''; // Clear loading spinner

                    // Handle empty alerts (success state)
                    if (!data || data.length === 0) {
                        container.innerHTML = `
                            <div class="bg-green-50 rounded-xl p-10 text-center border border-dashed border-green-300">
                                <svg class="mx-auto h-16 w-16 text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <p class="text-green-800 text-xl font-bold">All patients are up to date!</p>
                                <p class="text-green-600 mt-2 font-medium">No missed medications. Great job!</p>
                            </div>
                        `;
                        return;
                    }

                    // Render each alert card
                    data.forEach(alertData => {
                        let timeStr = alertData.scheduled_time;
                        if(timeStr && timeStr.length === 8) {
                            timeStr = timeStr.substring(0, 5); 
                        }

                        const cardHTML = `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-5 rounded-xl border-l-4 border-l-red-500 border-t border-r border-b border-gray-200 bg-red-50 hover:bg-red-100 transition-all duration-200 shadow-sm mb-4">
                                <div class="flex items-center space-x-5 mb-4 sm:mb-0">
                                    <div class="flex-shrink-0 bg-white shadow-sm border border-red-200 rounded-full p-3 text-red-600">
                                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-bold text-red-900">⚠️ ${alertData.message}</h3>
                                        <div class="mt-2 text-sm text-red-700 font-medium">
                                            <span>Patient: <strong>${alertData.patient_name}</strong></span> |
                                            <span>Medication: <strong>${alertData.medication_name}</strong></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="sm:text-right">
                                    <p class="text-sm text-red-600 font-semibold uppercase tracking-wider mb-1">Scheduled For</p>
                                    <p class="text-3xl font-black text-red-700">${timeStr}</p>
                                </div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', cardHTML);
                    });
                })
                .catch(error => {
                    console.error("Error fetching alerts:", error);
                    const container = document.getElementById('alerts-container');
                    container.innerHTML = `
                        <div class="bg-gray-50 rounded-xl p-6 text-center border border-gray-200">
                            <p class="text-red-600 font-bold text-lg">Error loading alerts.</p>
                            <p class="text-gray-500 text-sm mt-2">Please ensure the backend server is running and accessible.</p>
                            <p class="text-gray-400 text-xs mt-1">${error.message}</p>
                        </div>
                    `;
                });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchAlerts();
        });
    </script>
</body>
</html>
